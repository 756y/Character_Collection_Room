:root{--bg:#f5f4f0;--panel:#fff;--ink:#292b31;--muted:#777b86;--line:#e7e4dc;--accent:#e58a42;--accent2:#fff0e2;--dark:#22242b;--good:#287a59;--shadow:0 12px 34px #2525250b}

/* 介面更新：精簡頁首、柔和收藏卡片、編輯頁使用整頁版型 */
.wrap{max-width:1380px;padding:18px 24px}.topbar{margin-bottom:18px}.logo{width:38px;height:38px;border-radius:12px;font-size:19px}.brand h1{font-size:18px}.brand p{font-size:11px}.toolbar{margin:18px 0 14px}.toolbar h2{font-size:20px}.card{border-radius:16px}.cover{height:230px}.card-body{padding:14px}.card h3{font-size:16px}.grid{gap:15px}.filters{margin-bottom:14px}.footer-note{margin:26px 0 8px}
body.editor-mode{background:var(--bg)}body.editor-mode .wrap{display:none}body.editor-mode .modal-backdrop{display:block!important;position:static;inset:auto;background:transparent;padding:0;min-height:100vh;z-index:auto}body.editor-mode .modal{width:100%;max-width:1080px;min-height:100vh;max-height:none;overflow:visible;margin:0 auto;border-radius:0;padding:22px 24px;box-shadow:none;background:var(--bg)}body.editor-mode .modal-head{position:sticky;top:0;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}body.editor-mode .modal-head h2{font-size:20px}body.editor-mode .modal-actions{position:sticky;bottom:0;background:var(--bg);padding:14px 0;border-top:1px solid var(--line);z-index:4}body.editor-mode .form-grid{gap:16px}body.editor-mode .field input,body.editor-mode .field textarea,body.editor-mode .field select{background:var(--panel)}body.editor-mode .modal-backdrop.open{display:block}

.wrap{padding-top:0}.topbar{width:100vw;margin-left:calc(50% - 50vw);padding:13px max(24px,calc((100vw - 1332px)/2));background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 18px #25252508;position:sticky;top:0;z-index:15;min-height:68px}.brand{gap:10px}.brand p{letter-spacing:.12em;color:#96959a}.actions{align-items:center}.settings-btn{width:42px;height:42px;padding:0;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:19px;display:grid;place-items:center}.settings-btn:hover{background:#f7f4ee}.toolbar{margin-top:26px}.section-caption{margin:5px 0 0;color:var(--muted);font-size:12px}.card{box-shadow:0 5px 22px #25252509}.cover{cursor:pointer}.cover-favorite{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;padding:0;background:#ffffffdf;color:#c47735;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 8px #0001}.card-body{padding:13px 14px 12px}.card .badges{margin:8px 0 0;min-height:24px}.card-foot{margin-top:11px;padding-top:10px}.form-section{border-bottom:1px solid var(--line);padding:8px 0 11px;margin-top:7px}.form-section h3{font-size:16px;margin:0 0 4px}.form-section p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}.settings-panel{display:grid;gap:12px}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.settings-row strong{font-size:14px}.settings-row p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.settings-pill{font-size:11px;padding:6px 10px;border-radius:999px;background:#f3f0e9;color:#777;white-space:nowrap}
.arrow-setting-control{display:flex;align-items:center;gap:10px;flex:0 0 auto}.arrow-switch{position:relative;display:inline-block;width:48px;height:28px;flex:0 0 48px}.arrow-switch input{opacity:0;width:0;height:0;position:absolute}.arrow-switch-track{position:absolute;inset:0;border-radius:999px;background:#d8d5ce;transition:background .2s;cursor:pointer}.arrow-switch-track:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 1px 4px #0002;transition:transform .2s}.arrow-switch input:checked+.arrow-switch-track{background:var(--accent)}.arrow-switch input:checked+.arrow-switch-track:before{transform:translateX(20px)}.arrow-switch input:focus-visible+.arrow-switch-track{outline:3px solid #f4b16d;outline-offset:2px}.arrow-switch-label{font-size:12px;color:var(--muted);min-width:24px;text-align:right}
.image-carousel .carousel-nav{display:grid}.image-carousel .carousel-nav[hidden]{display:none!important}

/* 手機頁首固定單行：品牌、 新增角色、設定並排，不再被 420px 規則改成直向。 */
@media(max-width:420px){
 .topbar{flex-direction:row!important;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:8px}
 .brand{flex:1 1 auto;min-width:0;gap:7px}
 .brand .logo{flex:0 0 32px;width:32px;height:32px}
 .brand h1{font-size:15px;white-space:nowrap}
 .actions{flex:0 0 auto;flex-wrap:nowrap;gap:6px}
 #addTop{white-space:nowrap;padding:8px 9px;font-size:12px;min-height:40px}
 .settings-btn{flex:0 0 38px;width:38px;height:40px}
}

.image-carousel{position:relative;width:100%;height:100%;min-height:inherit;overflow:hidden;touch-action:pan-y;background:#eee5d8;display:grid;place-items:center}
.image-carousel img{display:block;width:100%;height:100%;object-fit:contain;transition:opacity .18s ease}.image-carousel img.drive-image-pending{opacity:0}.image-carousel:has(img.drive-image-pending){background:linear-gradient(110deg,#eee5d8 8%,#f7f2ea 18%,#eee5d8 33%);background-size:200% 100%;animation:driveImageShimmer 1.25s linear infinite}@keyframes driveImageShimmer{to{background-position-x:-200%}}
.image-carousel .carousel-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%;background:#202127a8;color:white;font-size:20px;z-index:2}
.image-carousel .carousel-prev{left:8px}.image-carousel .carousel-next{right:8px}
.image-carousel .carousel-count{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:4px 9px;border-radius:999px;background:#202127b8;color:#fff;font-size:11px;z-index:2;white-space:nowrap}
.cover .image-carousel{position:absolute;inset:0}.cover .image-carousel img{object-fit:cover}
.image-manager{position:relative;margin-top:10px;width:100%;max-width:none;aspect-ratio:16/9;height:auto;border-radius:14px;overflow:hidden;background:#eee5d8;border:1px solid var(--line);display:grid;place-items:center}
.image-manager .image-carousel{position:absolute;inset:0}
.image-manager .image-carousel img{object-fit:cover}
.image-remove-current{position:absolute;right:10px;top:10px;z-index:4;background:#22242bd9;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px}
.image-help{font-size:11px;color:var(--muted);line-height:1.6}
@media(max-width:420px){.image-carousel .carousel-nav{width:30px;height:30px}.image-manager{width:100%;max-width:none;height:auto;aspect-ratio:1/1}}


/* 角色編輯頁：最上方只顯示一張圖片，透過左右滑動切換 */
.image-editor-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.image-editor-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.image-editor-heading strong{font-size:16px}.image-upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.image-upload-button{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.image-help{font-size:11px;color:var(--muted);line-height:1.6}.image-editor-panel>.image-help{display:block;margin-top:10px}
@media(max-width:760px){.image-manager{width:100%;max-width:none;aspect-ratio:1/1}}
@media(max-width:560px){.image-editor-panel{padding:12px}.image-manager{width:100%;max-width:none;height:auto;aspect-ratio:1/1}}

.document-link-list{display:grid;gap:10px;margin-top:8px}.document-link-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.65fr) 56px 40px;gap:8px;align-items:center}.document-link-row input{box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);min-width:0;width:100%}.document-link-row .document-add,.document-link-row .document-remove{box-sizing:border-box;width:100%;min-width:0;min-height:38px;padding:7px 0;white-space:nowrap}.card-actions .icon-btn{font-size:12px;padding:7px 9px}.cover{touch-action:pan-y}.cover .image-carousel{cursor:pointer}.cover .carousel-nav{z-index:3}.cover-actions{position:absolute;right:10px;top:10px;z-index:5;display:flex;align-items:center;gap:5px;max-width:calc(100% - 20px)}.cover-actions button{height:34px;min-width:34px;padding:0 9px;border-radius:999px;background:#ffffffed;color:#51463d;border:1px solid #efd5b8;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;box-shadow:0 2px 8px #0001;white-space:nowrap}.cover-actions .cover-favorite{position:static;width:34px;min-width:34px;padding:0;font-size:18px;color:#c47735}.cover-actions button:hover{background:#fff5e9}.cover-actions .icon-btn{font-size:11px}.document-link-row .document-add{background:#eaf5ed;color:#287a59}.document-link-row .document-name{min-width:0}@media(max-width:700px){.document-link-row{grid-template-columns:minmax(0,1fr) 40px 56px}.document-link-row .document-url{grid-column:1/-1;grid-row:1}.document-link-row .document-name{grid-column:1;grid-row:2}.document-link-row .document-remove{grid-column:2;grid-row:2}.document-link-row .document-add{grid-column:3;grid-row:2}}
.card-foot{justify-content:space-between!important;align-items:center}.card-link-actions{display:flex;align-items:center;gap:6px;min-width:0}.card-link-actions button{height:32px;min-width:32px;padding:0 9px;border-radius:10px;background:#fff;color:#51463d;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 3px #00000008}.card-link-actions .card-star-action{color:#c47735;font-size:18px}.card-link-actions button:hover{background:#fff5e9}@media(max-width:700px){.card-link-actions{gap:4px}.card-link-actions button{min-width:28px;padding:0 7px}}

<body class="editor-mode">
<div class="wrap">
  <header class="topbar">
    <div class="brand"><div class="logo">✦</div><div><h1>角色收藏室</h1><p>角色資料庫</p></div></div>
    <div class="actions"><button class="primary" id="addTop">＋ 新增角色</button><button class="settings-btn" id="settingsBtn" type="button" aria-label="設定" title="設定">⚙️</button></div>
  </header>
  <div class="toolbar"><div><h2>我的角色 <span id="count" class="tiny">0 位</span></h2><p class="section-caption">整理、搜尋並管理你的 TRPG 角色</p></div><div class="tools"><input id="search" class="search" placeholder="搜尋角色、職業、標籤…" aria-label="搜尋角色"></div></div>
  <div class="filters" id="filters"><button class="chip active" data-filter="all">全部角色</button><button class="chip" data-filter="favorite">★ 收藏</button></div>
  <div id="gallery" class="grid"></div>
  <div class="footer-note">角色收藏室 · 將重要角色好好保存</div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">角色頁面</h2><button class="ghost" id="closeModal">✕ 關閉</button></div><div id="modalContent"><p class="hint">正在載入角色資料…</p></div></div></div>
<div class="toast" id="toast"></div>
<script src="./SheetReader.js"></script>
<script src="./PageFunctions.js"></script>
<script>
// 角色資料只讀寫目前 Google 帳號的 Google 試算表與 Drive；此頁不讀寫角色資料至 localStorage。
const PAGE_PARAMS=new URLSearchParams(location.search);
const isEditorPage=PAGE_PARAMS.get('page')==='editor'||location.pathname.endsWith('/character.html');
const editorTargetId=PAGE_PARAMS.get('id')||null;
if(isEditorPage)document.body.classList.add('editor-mode');
const IN_APPS_SCRIPT=!!(window.google&&google.script&&google.script.run);
const DEFAULT_CHARACTER_ID='CHR-000001';
const DEFAULT_CHARACTER_NAME='朝倉 森屋（あさくら もりや）';
let characters=[];
let cloudLoadVersion=0;
const CHARACTER_CACHE_PREFIX='ccr_character_cache_v1:';
let editorOpened=false;
function characterCacheKey(){
 let email='';
 try{email=(localStorage.getItem('ccr_google_account_email')||'').trim().toLowerCase()}catch(e){}
 if(!email)email=String(getCurrentAccountEmail()||'').trim().toLowerCase();
 return CHARACTER_CACHE_PREFIX+(email||'current-account');
}
function readCharacterCache(){
 try{const raw=localStorage.getItem(characterCacheKey());const value=raw?JSON.parse(raw):null;return Array.isArray(value)?value:null}catch(e){return null}
}
function writeCharacterCache(){
 try{localStorage.setItem(characterCacheKey(),JSON.stringify(characters))}catch(e){console.info('[CCR] 本機快取空間不足，這次只使用雲端資料。')}
}

const driveImageCache=new Map();
const driveImagePending=new Map();
let driveImageObserver=null;
// 不以瀏覽器本機資料作為角色來源；只有成功從目前登入者的雲端讀取後才填入清單。
const isOldDefaultCharacter=c=>!!c&&c.name===DEFAULT_CHARACTER_NAME&&(c.seed===true||c.id===DEFAULT_CHARACTER_ID);
let currentFilter='all', editingId=null, viewingId=null;
let editorDirty=false, editorSaving=false, discardingEditorChanges=false;
const $=id=>document.getElementById(id);
function saveLocal(){ writeCharacterCache(); /* cache is for instant display only; Google Sheets remains the source of truth */ }
function getCharacterCloudBridge(){
 // The editor may be nested more than one iframe deep. Search every same-origin ancestor,
 // not only the immediate parent, because the React app publishes the bridge on its own window.
 try{
  let current=window;
  for(let depth=0;depth<8;depth++){
   if(current&&current.__characterCloud)return current.__characterCloud;
   if(!current||current.parent===current)break;
   current=current.parent;
  }
 }catch(e){console.warn('[CCR] 無法讀取某個祖先視窗的雲端橋接物件。',e)}
 try{
  const opener=window.opener;
  if(opener&&!opener.closed){
   let current=opener;
   for(let depth=0;depth<8;depth++){
    if(current&&current.__characterCloud)return current.__characterCloud;
    if(!current||current.parent===current)break;
    current=current.parent;
   }
  }
 }catch(e){console.warn('[CCR] 無法讀取 opener 的雲端橋接物件。',e)}
 return null;
} 
function getCharacterCloudBridgeDiagnostics(){
 const result={inFrame:window.parent!==window,hasOpener:!!window.opener,hasSelfBridge:!!window.__characterCloud};
 try{result.hasParentBridge=!!window.parent.__characterCloud;result.parentUrl=window.parent.location.href}catch(e){result.parentAccess='blocked'}
 try{result.hasTopBridge=!!window.top.__characterCloud;result.topUrl=window.top.location.href}catch(e){result.topAccess='blocked'}
 return result;
}
function getCurrentAccountEmail(){const bridge=getCharacterCloudBridge();return bridge&&typeof bridge.email==='string'&&bridge.email.trim()?bridge.email:'無法取得登入電子郵件'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function tagsOf(c){return Array.isArray(c.tags)?c.tags: String(c.tags||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean)}
function effectiveImages(c){
 const list=Array.isArray(c?.images)?c.images:[];
 const images=[...new Set([...list,c?.portraitUrl,c?.originalImageUrl].filter(x=>typeof x==='string'&&x.trim()))];
 if(c){c.images=images;delete c.portraitUrl;delete c.originalImageUrl;}
 return images;
}
function effectiveImage(c){return effectiveImages(c)[0]||''}
let imageIndexes={};
let imageArrowPreference=null;
function getImageArrowPreference(){
 if(imageArrowPreference!==null)return imageArrowPreference;
 return !window.matchMedia('(max-width: 700px)').matches;
}
function setImageArrowPreference(enabled){
 imageArrowPreference=!!enabled;
 document.querySelectorAll('.image-carousel').forEach(el=>{
  el.querySelectorAll('.carousel-nav').forEach(btn=>btn.remove());
  const count=Number(el.dataset.carouselCount||0),key=el.dataset.carouselKey||'';
  if(!enabled||count<2)return;
  const prev=document.createElement('button');prev.type='button';prev.className='carousel-nav carousel-prev';prev.setAttribute('aria-label','上一張圖片');prev.textContent='‹';prev.onclick=e=>{e.stopPropagation();changeCharacterImage(key,-1)};
  const next=document.createElement('button');next.type='button';next.className='carousel-nav carousel-next';next.setAttribute('aria-label','下一張圖片');next.textContent='›';next.onclick=e=>{e.stopPropagation();changeCharacterImage(key,1)};
  el.append(prev,next);
 });
 const input=document.getElementById('showImageArrowsToggle');
 if(input)input.checked=enabled;
 const label=document.getElementById('showImageArrowsState');if(label)label.textContent=enabled?'開啟':'關閉';
}

function carouselMarkup(images,key,alt){
 const list=Array.isArray(images)?images.filter(Boolean):[];
 if(!list.length)return '<div class="placeholder">✦</div>';
 const idx=((imageIndexes[key]||0)%list.length+list.length)%list.length;
 const isCard=key.startsWith('card:');
 const controls=list.length>1&&!isCard?`<span class="carousel-count">${idx+1} / ${list.length}</span>`:'';
 const arrows=list.length>1&&getImageArrowPreference()?`<button type="button" class="carousel-nav carousel-prev" aria-label="上一張圖片" onclick="event.stopPropagation();changeCharacterImage('${esc(key)}',-1)">‹</button><button type="button" class="carousel-nav carousel-next" aria-label="下一張圖片" onclick="event.stopPropagation();changeCharacterImage('${esc(key)}',1)">›</button>`:'';
 const selected=list[idx];
 const driveId=typeof selected==='string'&&selected.startsWith('drive://')?selected.slice('drive://'.length):'';
 const cached=driveId?driveImageCache.get(driveId):'';
 const imgSrc=driveId?(cached||'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='):selected;
 const driveAttr=driveId&&!cached?` data-drive-id="${esc(driveId)}" class="drive-image-pending"` : '';
 return `<div class="image-carousel" data-carousel-key="${esc(key)}" data-carousel-count="${list.length}"><img${driveAttr} src="${esc(imgSrc)}" alt="${esc(alt||'角色圖片')}" loading="lazy" decoding="async" fetchpriority="${isCard?'low':'high'}">${arrows}${controls}</div>`;
}
function applyResolvedDriveImage(img,url){
 if(!img||!url)return;
 const finish=()=>{img.classList.remove('drive-image-pending');img.removeAttribute('data-drive-id')};
 img.addEventListener('load',finish,{once:true});
 img.addEventListener('error',finish,{once:true});
 img.src=url;
 if(img.complete&&img.naturalWidth>0)finish();
}
function resolveDriveImage(id){
 if(!id)return Promise.resolve('');
 if(driveImageCache.has(id))return Promise.resolve(driveImageCache.get(id));
 if(driveImagePending.has(id))return driveImagePending.get(id);
 const bridge=getCharacterCloudBridge();
 if(!bridge||typeof bridge.resolveImage!=='function')return Promise.resolve('');
 const promise=bridge.resolveImage('drive://'+id)
  .then(url=>{if(url)driveImageCache.set(id,url);return url||''})
  .catch(error=>{console.warn('角色圖片載入失敗',id,error);return ''})
  .finally(()=>driveImagePending.delete(id));
 driveImagePending.set(id,promise);
 return promise;
}
function loadDriveImageElement(img){
 const id=img?.dataset?.driveId;if(!id)return;
 resolveDriveImage(id).then(url=>{if(url&&img.isConnected)applyResolvedDriveImage(img,url)});
}
// 預載採低併發、閒置時執行：先讓目前可見圖片顯示，再於背景暖好後續圖片。
let drivePrefetchQueue=[],drivePrefetchRunning=0,drivePrefetchQueued=new Set();
function enqueueDriveImagePrefetch(id){
 if(!id||driveImageCache.has(id)||driveImagePending.has(id)||drivePrefetchQueued.has(id))return;
 drivePrefetchQueued.add(id);drivePrefetchQueue.push(id);runDriveImagePrefetchQueue();
}
function runDriveImagePrefetchQueue(){
 while(drivePrefetchRunning<2&&drivePrefetchQueue.length){
  const id=drivePrefetchQueue.shift();drivePrefetchQueued.delete(id);
  if(driveImageCache.has(id)||driveImagePending.has(id))continue;
  drivePrefetchRunning++;
  resolveDriveImage(id).finally(()=>{drivePrefetchRunning--;if(drivePrefetchQueue.length)runDriveImagePrefetchQueue()});
 }
}
function scheduleBackgroundImagePrefetch(){
 const ids=[];
 const addImages=images=>(Array.isArray(images)?images:[]).forEach(src=>{
  if(typeof src==='string'&&src.startsWith('drive://'))ids.push(src.slice('drive://'.length));
 });
 if(isEditorPage){
  addImages(window._editingImages);
  const target=characters.find(c=>String(c.id)===String(editorTargetId||editingId||viewingId||''));
  if(target)addImages(effectiveImages(target));
 }else{
  characters.forEach(c=>addImages(effectiveImages(c)));
 }
 const unique=[...new Set(ids)];
 const schedule=()=>unique.forEach(enqueueDriveImagePrefetch);
 if('requestIdleCallback' in window)requestIdleCallback(schedule,{timeout:1800});
 else setTimeout(schedule,450);
}
function hydrateVisibleDriveImages(){
 const images=document.querySelectorAll('img[data-drive-id]');
 if(!images.length)return;
 if(!('IntersectionObserver' in window)){images.forEach(loadDriveImageElement);return;}
 if(!driveImageObserver)driveImageObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){driveImageObserver.unobserve(entry.target);loadDriveImageElement(entry.target)}}),{rootMargin:'180px'});
 images.forEach(img=>{if(driveImageCache.has(img.dataset.driveId)){img.src=driveImageCache.get(img.dataset.driveId);img.removeAttribute('data-drive-id')}else driveImageObserver.observe(img)});
}
function changeCharacterImage(key,delta){
 const node=Array.from(document.querySelectorAll('.image-carousel[data-carousel-key]')).find(n=>n.dataset.carouselKey===key);
 const count=Number(node?.dataset.carouselCount||0);if(count<2)return;
 imageIndexes[key]=(((imageIndexes[key]||0)+delta)%count+count)%count;
 if(key==='editor')renderImageManager();else render();
 scheduleBackgroundImagePrefetch();
}
let suppressCoverClickUntil=0;
function bindImageSwipe(){
 document.querySelectorAll('.cover[data-edit-character]').forEach(cover=>{if(cover.dataset.editClickBound==='1')return;cover.dataset.editClickBound='1';let startX=0,startY=0,swiped=false;cover.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;swiped=false},{passive:true});cover.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-startX)>35||Math.abs(e.clientY-startY)>35){swiped=true;suppressCoverClickUntil=Date.now()+500}},{passive:true});cover.addEventListener('click',e=>{if(Date.now()<suppressCoverClickUntil||swiped){e.preventDefault();e.stopPropagation();swiped=false;return}if(e.target.closest('button'))return;openEditor(cover.dataset.editCharacter)});cover.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();openEditor(cover.dataset.editCharacter)}})});
 document.querySelectorAll('.image-carousel[data-carousel-count]').forEach(el=>{
  if(el.dataset.swipeBound==='1')return;el.dataset.swipeBound='1';
  let startX=0,startY=0;
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
   if(Number(el.dataset.carouselCount)<2)return;
   const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;
   if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25){suppressCoverClickUntil=Date.now()+550;e.preventDefault();e.stopPropagation();changeCharacterImage(el.dataset.carouselKey,dx<0?1:-1);}
  },{passive:false});
 });
}
function renderImageManager(){
 const host=$('imageManager');if(!host)return;
 const list=window._editingImages||[];
 const idx=list.length?(((imageIndexes.editor||0)%list.length+list.length)%list.length):0;
 imageIndexes.editor=idx;
 host.innerHTML=list.length?`${carouselMarkup(list,'editor','角色圖片')}<button class="image-remove-current" type="button" onclick="removeCharacterImage(${idx})">移除這張圖片</button>`:'<div class="image-help">目前沒有圖片，請使用下方「上傳圖片」新增。</div>';
 bindImageSwipe();
 hydrateVisibleDriveImages();
 scheduleBackgroundImagePrefetch();
}
function removeCharacterImage(index){editorDirty=true;window._editingImages=(window._editingImages||[]).filter((_,i)=>i!==index);imageIndexes.editor=Math.max(0,Math.min(index,imageIndexes.editor||0));renderImageManager();toast('已移除圖片');}
async function optimizeImageFile(file){
 const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(file)});
 return await new Promise(resolve=>{
  const img=new Image();img.onload=()=>{
   const max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const type=file.type==='image/png'?'image/png':'image/jpeg';
   try{resolve(canvas.toDataURL(type,type==='image/jpeg'?0.86:undefined))}catch(_){resolve(dataUrl)}
  };img.onerror=()=>resolve(dataUrl);img.src=dataUrl;
 });
}
async function handleImageFiles(fileList){
 const files=Array.from(fileList||[]).filter(f=>f.type.startsWith('image/'));
 if(!files.length)return;
 const current=window._editingImages||[];
 if(current.length+files.length>10){toast('每位角色最多保留 10 張圖片');$('f_imageFiles').value='';return}
 toast('正在處理圖片…');
 try{for(const file of files)current.push(await optimizeImageFile(file));editorDirty=true;window._editingImages=current;renderImageManager();toast(`已新增 ${files.length} 張圖片`);}
 catch(e){toast('圖片讀取失敗，請再試一次')}
 const input=$('f_imageFiles');if(input)input.value='';
}
function fitTagBadges(){
 document.querySelectorAll('.badges[data-tags]').forEach(box=>{
  const tags=JSON.parse(box.dataset.tags||'[]');
  const nodes=Array.from(box.querySelectorAll('[data-tag-index]'));
  box.querySelector('.badge-more')?.remove();
  nodes.forEach(n=>{n.hidden=false});
  if(!tags.length)return;
  const maxHeight=58;
  let overflowAt=nodes.length;
  for(let i=0;i<nodes.length;i++){
   const n=nodes[i];
   if(n.offsetTop-box.offsetTop+n.offsetHeight>maxHeight){overflowAt=i;break;}
  }
  if(overflowAt===nodes.length)return;
  nodes.slice(overflowAt).forEach(n=>{n.hidden=true});
  let hiddenCount=nodes.length-overflowAt;
  const more=document.createElement('span');
  more.className='badge-more';more.textContent='+'+hiddenCount;box.appendChild(more);
  while(more.offsetTop-box.offsetTop+more.offsetHeight>maxHeight&&overflowAt>0){
   overflowAt--;
   if(!nodes[overflowAt].hidden){nodes[overflowAt].hidden=true;hiddenCount++;more.textContent='+'+hiddenCount;}
  }
 });
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const shown=characters.filter(c=>{
  const hay=[c.name,c.alias,c.occupation,c.system,c.type,c.work,c.age,c.gender,c.player,c.nationality,c.description,c.backstory,c.personality,c.beliefs,c.importantPeople,c.importantPlaces,c.injuries,c.possessions,c.phobias,c.notes,...tagsOf(c),...Object.entries(c.attributes||{}).flat(),...Object.entries(c.skills||{}).flat()].join(' ').toLocaleLowerCase();
  const match=!q||hay.includes(q);
  const f=currentFilter==='all'||(currentFilter==='favorite'&&c.favorite)||(currentFilter==='COC'&&/coc|克蘇魯/i.test((c.system||'')+' '+(c.type||'')))||(currentFilter==='自訂'&& !/coc|克蘇魯/i.test((c.system||'')+' '+(c.type||'')));
  return match&&f;
 });
 $('count').textContent=`${shown.length} 位`;
 if(!shown.length){$('gallery').className='';$('gallery').innerHTML=`<div class="empty"><div class="emoji">🪄</div><h3>還沒有符合條件的角色</h3><p>新增一張角色卡，貼上來源網址後，可以先建立角色資料，再慢慢補齊設定。</p><button class="primary" onclick="openEditor()">＋ 新增第一位角色</button></div>`;return}
 $('gallery').className='grid';
 $('gallery').innerHTML=shown.map(c=>{
  const imgs=effectiveImages(c), tags=tagsOf(c);
  const sheetUrl=String(c.sourceUrl||'').trim();
  const hasSheet=/^https:\/\/docs\.google\.com\/spreadsheets\//i.test(sheetUrl);
  const relatedLinks=normalizeDocumentLinks(c.documentLinks);
  const docs=relatedLinks.filter(d=>/^https:\/\/(docs\.google\.com|drive\.google\.com)\//i.test(d.url));
  const videos=relatedLinks.filter(d=>isYouTubeUrl(d.url));
  const actions=`<div class="card-link-actions"><button class="card-star-action" title="${c.favorite?'取消收藏':'加入收藏'}" aria-label="${c.favorite?'取消收藏':'加入收藏'}" onclick="event.stopPropagation();toggleFavorite('${esc(c.id)}')">${c.favorite?'★':'☆'}</button>${hasSheet?`<button class="link-sheets" type="button" title="開啟 Google 試算表" aria-label="開啟 Google 試算表" onclick="event.stopPropagation();openCharacterSpreadsheet('${esc(c.id)}')"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 2h10l4 4v16H5z"/><path fill="#fff" d="M8 9h8v1.6H8zm0 3.3h8v1.6H8zm0 3.3h8v1.6H8z"/><path fill="#188038" d="M3 5h7v14H3z"/><path fill="#fff" d="M4.5 8h4v1.3h-4zm0 3h4v1.3h-4zm0 3h4v1.3h-4z"/></svg></button>`:''}${docs.length?`<button class="link-docs" type="button" title="開啟 Google 文件" aria-label="開啟 Google 文件" onclick="event.stopPropagation();openCharacterDocuments('${esc(c.id)}')"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 2h10l4 4v16H5z"/><path fill="#fff" d="M15 2v5h4M8 11h8v1.5H8zm0 3.5h8V16H8zm0 3.5h6v1.5H8z"/></svg></button>`:''}${videos.length?`<button class="link-youtube" type="button" title="開啟 YouTube 影片" aria-label="開啟 YouTube 影片" onclick="event.stopPropagation();openCharacterYouTube('${esc(c.id)}')"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 8.5 16 12l-6 3.5z" fill="#ff0033"/></svg></button>`:''}</div>`;
  return `<article class="card"><div class="cover" data-edit-character="${esc(c.id)}" role="button" tabindex="0" aria-label="點擊編輯 ${esc(c.name||'角色')}">${carouselMarkup(imgs,'card:'+c.id,c.name)}<span class="tagline">${esc(c.system||c.type||'角色')}</span></div><div class="card-body"><h3>${esc(c.name||'未命名角色')}${c.favorite?' <span style="color:#e58a42">★</span>':''}</h3><div class="sub">${esc(c.occupation||'尚未設定職業')}${c.age?' · '+esc(c.age)+' 歲':''}</div><div class="badges" data-tags="${esc(JSON.stringify(tags))}">${tags.map((t,i)=>`<span class="badge" data-tag-index="${i}">${esc(t)}</span>`).join('')}</div><div class="card-foot">${actions}<button class="icon-btn" title="編輯角色" onclick="event.stopPropagation();openEditor('${esc(c.id)}')">編輯</button></div></div></article>`
 }).join('');
 fitTagBadges();
 bindImageSwipe();
 hydrateVisibleDriveImages();
 scheduleBackgroundImagePrefetch();
}
function openModal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modalBackdrop').classList.add('open')}
function closeModal(){if(isEditorPage){cancelEditor();return}if($('f_name')){editorDirty=false;discardingEditorChanges=true} $('modalBackdrop').classList.remove('open');editingId=null;viewingId=null}
function cancelEditor(){editorDirty=false;editorSaving=false;discardingEditorChanges=true;if(!isEditorPage){$('modalBackdrop').classList.remove('open');editingId=null;viewingId=null;return}if(window.opener&&!window.opener.closed){window.close();setTimeout(()=>{if(!window.closed)navigateToGallery()},150);return}navigateToGallery()}
function bindEditorDirtyTracking(){const host=$('modalContent');if(!host||host.dataset.dirtyTracking==='1')return;host.dataset.dirtyTracking='1';const mark=e=>{if($('f_name')&&e.target.closest('#modalContent'))editorDirty=true};host.addEventListener('input',mark);host.addEventListener('change',mark)}

  toast('雲端同步失敗：'+(error?.message||String(error)));

  return {ok:false,error:error?.message||String(error)}
 }
}
function openEditorAfterLoad(){if(isEditorPage&&!editorOpened)openEditor(editorTargetId||undefined)}
window.addEventListener('focus',()=>{if(!isEditorPage && document.visibilityState==='visible' && getCharacterCloudBridge())loadCloudCharacters()});
async function loadCloudCharacters(){
 const loadVersion=++cloudLoadVersion;
 if(IN_APPS_SCRIPT){
  google.script.run.withSuccessHandler(list=>{if(loadVersion!==cloudLoadVersion)return;characters=Array.isArray(list)?list:[];saveLocal();render();openEditorAfterLoad()})
   .withFailureHandler(err=>{if(loadVersion!==cloudLoadVersion)return;if(!characters.length)characters=[];render();toast('資料庫載入失敗：'+(err?.message||err));openEditorAfterLoad()}).loadCharactersFromSheet();
  return;
 }
 const bridge=getCharacterCloudBridge();
 if(!bridge){
  if(!characters.length)render();toast('Google 雲端連線尚未就緒：正在等待登入連線，請稍候。');return;
 }
 try{
  if(typeof bridge.list!=='function')throw new Error('目前網站的雲端橋接版本過舊，請重新部署 GitHub Pages。');
  // 僅讀取目前登入帳號的資料；絕不把任何本機資料匯入資料庫。
  const result=await bridge.list(isEditorPage&&editorTargetId?{hydrateId:editorTargetId}:{});
  if(loadVersion!==cloudLoadVersion)return;
  if(!Array.isArray(result))throw new Error('資料庫回傳格式不正確。');
  characters=result;
  saveLocal();
  render();
  if(isEditorPage&&editorTargetId&&editorOpened&&!editorDirty){openEditor(editorTargetId);}
  if(!result.length)toast('資料庫已成功連線，但這個登入帳號目前沒有角色資料。');
 }catch(error){
  if(loadVersion!==cloudLoadVersion)return;
  if(!characters.length)render();toast('雲端更新失敗，先顯示上次快取的角色資料：'+(error?.message||String(error)));return;
 }
 openEditorAfterLoad();
}

function exportData(){
 const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),characters},null,2)],{type:'application/json;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='角色收藏室_備份.json';a.click();URL.revokeObjectURL(a.href);toast('已匯出 JSON 備份');
}
function requestAccountLogout(){
 const message={type:'CHARACTER_ROOM_LOGOUT'};
 try{
  if(window.parent&&window.parent!==window) window.parent.postMessage(message,location.origin);
  else if(window.opener&&!window.opener.closed) window.opener.postMessage(message,location.origin);
  else toast('目前頁面無法連結登入狀態，請回到收藏室首頁操作。');
 }catch(error){toast('無法登出，請回到收藏室首頁再試。')}
}
function openSettings(){
 openModal('設定',`<div class="settings-panel"><div class="settings-row"><div><strong>角色資料備份</strong><p>將目前這個瀏覽器儲存的角色資料匯出成 JSON 檔案。</p></div><button class="secondary" type="button" onclick="exportData();closeModal()">匯出備份</button></div><div class="settings-row"><div><strong>資料儲存方式</strong><p>角色資料與圖片會保存至目前 Google 帳號的 Google 試算表與 Drive，不會以瀏覽器本機儲存作為資料來源。</p></div><span class="settings-pill">雲端同步</span></div><div class="settings-row"><div><strong>圖片切換箭頭</strong><p>控制角色清單與角色頁面圖片兩側的切換箭頭。首次使用時，電腦版預設開啟、手機版預設關閉；手動調整後會記住你的選擇。</p></div><div class="arrow-setting-control"><label class="arrow-switch"><input id="showImageArrowsToggle" type="checkbox" onchange="setImageArrowPreference(this.checked)"><span class="arrow-switch-track"></span></label><span class="arrow-switch-label" id="showImageArrowsState">開啟</span></div></div><div class="settings-row"><div><strong>目前登入帳號</strong><p class="account-email">${esc(getCurrentAccountEmail())}</p></div><button class="danger" type="button" onclick="requestAccountLogout()">登出帳號</button></div><div class="modal-actions"><div></div><div class="right"><button class="primary" onclick="closeModal()">完成</button></div></div></div>`);
 const arrowToggle=document.getElementById('showImageArrowsToggle');if(arrowToggle){arrowToggle.checked=getImageArrowPreference();const state=document.getElementById('showImageArrowsState');if(state)state.textContent=arrowToggle.checked?'開啟':'關閉';}
}
function csvParse(text){
 const out=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell=''}else cell+=ch}
 if(cell.length||row.length){row.push(cell);out.push(row)}return out;
}
function importFile(file){
 const reader=new FileReader();reader.onload=()=>{
  const txt=String(reader.result||'');let added=[];
  try{
   if(/\.json$/i.test(file.name)||txt.trim().startsWith('{')||txt.trim().startsWith('[')){
    const parsed=JSON.parse(txt);const list=Array.isArray(parsed)?parsed:(parsed.characters||parsed.data||[]);
    added=list.map((x,i)=>normalizeImported(x,i));
   }else{
    const rows=csvParse(txt);const header=(rows[0]||[]).map(x=>x.trim().toLowerCase());
    // COC 人物卡 CSV 可能把完整 JSON 拆在相鄰儲存格；使用與 Google Sheets 連結相同的解析器。
    const response={table:{rows:rows.map(r=>({c:r.map(v=>v===''?null:{v})}))}};
    const raw=findFullJson(response);
    if(raw){const mapped=mapCompleteCharacter(raw,'',response);added=[normalizeImported(mapped,0)];}
    else{
     const idx=(...names)=>header.findIndex(h=>names.some(n=>h===n||h.includes(n)));
     const ni=idx('name','角色','姓名'),oi=idx('occupation','職業','職位'),ai=idx('age','年齡'),gi=idx('gender','性別'),si=idx('system','系統'),di=idx('description','簡介','背景'),pi=idx('portrait_url','image','img','圖片','封面');
     if(ni>=0){added=rows.slice(1).filter(r=>r[ni]).map((r,i)=>normalizeImported({name:r[ni],occupation:oi>=0?r[oi]:'',age:ai>=0?r[ai]:'',gender:gi>=0?r[gi]:'',system:si>=0?r[si]:'',description:di>=0?r[di]:'',images:pi>=0&&r[pi]?[r[pi]]:[]},i))}
     else throw new Error('這份 CSV 不是可辨識的角色卡格式，請確認檔案內容。');
    }
   }
   added=added.filter(x=>x&&x.name);if(!added.length)throw new Error('找不到可匯入的角色');characters=[...added,...characters.filter(c=>!added.some(a=>a.name===c.name))];saveLocal();render();toast(`準備將 ${added.length} 位角色寫入資料庫…`);syncIfConfigured('import',added).then(result=>{if(result?.ok){loadCloudCharacters();toast(`已成功寫入資料庫 ${added.length} 位角色`)}else{loadCloudCharacters();toast('匯入資料庫失敗，請查看錯誤訊息後重試')}});
  }catch(e){toast('匯入失敗：請確認檔案是有效的 CSV 或 JSON')}
 };reader.readAsText(file,'UTF-8');
}
function normalizeImported(x,i){const value={...{id:'CHR-'+Date.now().toString().slice(-7)+i,name:'未命名角色',alias:'',work:'',type:'自訂角色',system:'',occupation:'',age:'',gender:'',player:'',nationality:'',images:[],sourceUrl:'',description:'',backstory:'',personality:'',beliefs:'',importantPeople:'',importantPlaces:'',specialAbilities:'',injuries:'',possessions:'',phobias:'',attributes:{},skills:{},tags:[],favorite:false,notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},...x,id:x.id||('CHR-'+Date.now().toString().slice(-7)+i),tags:Array.isArray(x.tags)?x.tags:String(x.tags||'').split(/[,，、]/).map(t=>t.trim()).filter(Boolean)};value.images=[...new Set([...(Array.isArray(value.images)?value.images:[]),value.portraitUrl,value.originalImageUrl].filter(v=>typeof v==='string'&&v.trim()))];delete value.portraitUrl;delete value.originalImageUrl;return value}
function setCurrentFilter(filter){
 currentFilter=filter||'all';
 document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===currentFilter));
 render();
}
const cachedCharacters=readCharacterCache();
if(cachedCharacters){characters=cachedCharacters;}
if(isEditorPage && !editorTargetId){render();openEditor();loadCloudCharacters();}
else{
 render();
 if(isEditorPage&&editorTargetId&&characters.some(c=>String(c.id)===String(editorTargetId))){openEditor(editorTargetId);}
 loadCloudCharacters();
}
window.addEventListener('resize',fitTagBadges);
